x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "2"

services:
  wdgb:
    build:
      context: .
      dockerfile: wikidata-graph-builder/Dockerfile
    container_name: wikidata_graph_builder
    logging: *default-logging
    environment:
      - APP_DUMPFILES_DIR=/dumps
      - APP_DUMPFILES_PATTERN=*pages-articles*xml*.bz2
      - APP_EXECUTORPOOL_COREPOOLSIZE=${WDGB_POOL_SIZE:-2}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://wiki-es-pg:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_NEO4J_URI=bolt://wiki-es-neo:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=${NEO4J_USER}
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=${NEO4J_PASSWORD}
      - JAVA_TOOL_OPTIONS=-Xmx${WDGB_HEAP:-2g}
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - wikidata-dumps:/dumps
    networks:
      - wiki-es-network
  wppe:
    build:
      context: .
      dockerfile: wikipedia-page-extractor/Dockerfile
    container_name: wikipedia_page_extractor
    logging: *default-logging
    environment:
      - APP_DUMPFILES_DIR=/dumps
      - APP_DUMPFILES_PATTERN=*pages-articles*xml*.bz2
      - APP_EXECUTORPOOL_COREPOOLSIZE=${WPPE_POOL_SIZE:-2}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://wiki-es-pg:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JAVA_TOOL_OPTIONS=-Xmx${WPPE_HEAP:-2g}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - wikipedia-dumps:/dumps
    networks:
      - wiki-es-network
  wsa:
    build:
      context: .
      dockerfile: wiki_summary/Dockerfile
    container_name: wiki_summary_annotator
    logging: *default-logging
    environment:
      # Real environment variables take precedence over the mounted .env (load_dotenv does not override them).
      - DB_HOST=wiki-es-pg
      - DB_PORT=5432
      - NEO4J_HOST=wiki-es-neo
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
    networks:
      - wiki-es-network
  relief:
    # Ground-truth annotation (RELIEF). One-off jobs: `docker compose run --rm relief <command>`.
    build:
      context: .
      dockerfile: relief/Dockerfile
      args:
        GIT_COMMIT: ${RELIEF_GIT_COMMIT:-unknown}
    image: wikes-relief:latest
    profiles: [ "relief" ]
    logging: *default-logging
    env_file:
      - .env
    environment:
      - DB_HOST=wiki-es-pg
      - DB_PORT=5432
      - NEO4J_HOST=wiki-es-neo
      - NEO4J_PORT=7687
      - HF_HOME=/models
      - RELIEF_RUNS_DIR=/runs
      # which GPUs the container sees: "all", or e.g. "0" / "1" / "0,1" (RELIEF_GPUS in .env)
      - NVIDIA_VISIBLE_DEVICES=${RELIEF_GPUS:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ${RELIEF_RUNS_PATH:-./relief-runs}:/runs
      - ${RELIEF_MODELS_PATH:-./relief-models}:/models
    shm_size: 4g
    # GPUs through the nvidia runtime rather than `deploy.resources.reservations.devices`: the latter goes through
    # CDI, which fails with snap-installed Docker (as on sol: the confined daemon can't see the host paths the
    # CDI spec lists). The runtime works there and on Docker Desktop (WSL2).
    runtime: nvidia
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - wiki-es-network
  postgres:
    hostname: wiki-es-pg
    # Pinned: postgres:18+ images changed the data directory layout and refuse a mount at /var/lib/postgresql/data.
    image: 'postgres:16'
    restart: unless-stopped
    shm_size: 1g
    logging: *default-logging
    healthcheck:
      test: pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    networks:
      - wiki-es-network

  neo4j:
    hostname: wiki-es-neo
    image: 'neo4j:5.26'
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: [ "CMD", "neo4j", "status" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    env_file:
      - configs/neo4j.env
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data
    ports:
      - '7474:7474'
      - '7687:7687'
    networks:
      - wiki-es-network

networks:
  wiki-es-network:
    external: true

volumes:
  postgres-volume:
    driver: local
    driver_opts:
      type: none
      device: ${POSTGRES_VOLUME_PATH}
      o: bind

  neo4j-data:
    driver: local
    driver_opts:
      type: none
      device: ${NEO4J_VOLUME_PATH}
      o: bind

  wikidata-dumps:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${WIKIDATA_DUMPS_PATH}

  wikipedia-dumps:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${WIKIPEDIA_DUMPS_PATH}
